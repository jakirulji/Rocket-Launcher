name: License audit

on:
  push:
    branches:
      - '16-dev'
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.gitmodules'
      - '.github/workflows/license-audit.yml'
      - 'LICENSE.txt'
      - 'COPYING'
      - 'NOTICE'
      - 'LICENSE_COMPLIANCE.md'
      - 'THIRD_PARTY_LICENSES/**'
      - 'rocketlauncher/assets/license.html'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.jar'
      - '**/*.so'
      - 'platform_frameworks_libs_systemui/**'
      - 'systemUI/**'
  pull_request:
    branches:
      - '16-dev'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate dependency license report
        run: ./gradlew --no-daemon licensee
      - name: Reject GPL-2.0-only dependencies in GPLv3 combined build
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          incompatible = []
          for report in glob.glob("**/build/reports/licensee/**/artifacts.json", recursive=True):
              with open(report, encoding="utf-8") as source:
                  artifacts = json.load(source)
              for artifact in artifacts:
                  for license_info in artifact.get("spdxLicenses", []):
                      if license_info.get("identifier") in {"GPL-2.0", "GPL-2.0-only"}:
                          coordinate = ":".join(
                              str(artifact.get(key, "")) for key in ("groupId", "artifactId", "version")
                          )
                          incompatible.append(f"{report}: {coordinate} ({license_info['identifier']})")

          if incompatible:
              print("GPL-2.0-only dependencies are incompatible with this GPLv3-covered combined build:")
              print("\n".join(incompatible))
              sys.exit(1)

          print("No GPL-2.0-only dependencies found in Licensee reports.")
          PY
      - name: Verify required license and attribution files
        run: |
          test -s LICENSE.txt
          test -s COPYING
          test -s NOTICE
          test -s THIRD_PARTY_LICENSES/DRAGON_LAUNCHER.md
          test -s rocketlauncher/assets/license.html
          grep -q "Apache License" LICENSE.txt
          grep -q "GNU GENERAL PUBLIC LICENSE" COPYING
          grep -q "GNU GENERAL PUBLIC LICENSE" rocketlauncher/assets/license.html
          grep -q "MIT License" rocketlauncher/assets/license.html
          grep -q "Dragon Launcher" NOTICE
          ! grep -q 'href="../../COPYING"' rocketlauncher/assets/license.html
      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocket-launcher-license-audit
          path: |
            **/build/reports/licensee/**
            **/licenses.json
          if-no-files-found: warn
