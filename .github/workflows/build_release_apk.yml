name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 16-dev

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/16-dev' || endsWith(github.ref, '-alpha') || endsWith(github.ref, '-beta') || endsWith(github.ref, '-rc') || endsWith(github.ref, '-stable')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Configure permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Copy the same signing secrets used by Daily_Tracker into Rocket-Launcher repository settings."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("keystore.properties")
          p.write_text(
              "storePassword=" + os.environ["KEYSTORE_PASSWORD"] + "\\n" +
              "keyAlias=" + os.environ["KEY_ALIAS"] + "\\n" +
              "keyPassword=" + os.environ["KEY_PASSWORD"] + "\\n" +
              "storeFile=" + str(Path(os.environ["GITHUB_WORKSPACE"]) / "key.jks") + "\\n",
              encoding="utf-8",
          )
          PY
          keytool -list -keystore "$GITHUB_WORKSPACE/key.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Permanent release signing keystore verified."
      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release APK
          path: build/outputs/*

